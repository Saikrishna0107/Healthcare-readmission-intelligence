  plan: {metrics: [avg_payment_reduction_among_penalized_pct], filters: [[fiscal_year, '=', FY2025]]}
  sql: |
    select sum(payment_reduction_pct) / count(*) filter (where is_penalized) as value
    from {hy} where fiscal_year = 'FY2025'

