# Evaluation set for the question-answering agent (step 8c, D-010).
#
# Written separately from the eight development questions used to tune the prompt and the code
# rules (docs/decisions.md, D-010), so the score is not inflated by that tuning.
#
# Each answerable question has a gold answer from SQL written by hand directly on the marts,
# without MetricFlow, so a wrong metric definition or join would show up as a disagreement.
#   metric: the metric(s) that answer the question (any one of them counts)
#   keys:   the breakdown the answer must have (dimension names); [] for a single number
#   sql:    returns the key columns and `value`. {hy} and {rr} expand to the hospital-year and
#           readmission-result facts joined to their hospital (left joins, like MetricFlow).
#   plan:   a correct query plan (filters as [dimension, op, value]). Run with a scripted model,
#           the reference plans must score 100%: this checks the gold SQL and the scorer.
#   A question with no year means the latest, FY2026.
# Declines have `expect: decline` and the reason a careful analyst would give.

- id: s01
  category: single number
  question: How many hospitals were in the HRRP payment file in FY2024?
  metric: hospitals_in_payment_file
  keys: []
  plan: {metrics: [hospitals_in_payment_file], filters: [[fiscal_year, '=', FY2024]]}
  sql: select count(*) filter (where in_payment_file) as value from {hy} where fiscal_year = 'FY2024'

- id: s02
  category: single number
  question: What percentage of hospitals got a readmission penalty in FY2021?
  metric: share_penalized
  keys: []
  plan: {metrics: [share_penalized], filters: [[fiscal_year, '=', FY2021]]}
  sql: |
    select count(*) filter (where is_penalized) / count(*) filter (where in_payment_file) as value
    from {hy} where fiscal_year = 'FY2021'

- id: s03
  category: single number
  question: What is the largest payment reduction any hospital received this year?
  metric: max_payment_reduction_pct
  keys: []
  plan: {metrics: [max_payment_reduction_pct]}
  sql: select max(payment_reduction_pct) as value from {hy} where fiscal_year = 'FY2026'

- id: s04
  category: single number
  question: How many hospitals hit the maximum 3% penalty in FY2026?
  metric: hospitals_at_max_penalty
  keys: []
  plan: {metrics: [hospitals_at_max_penalty], filters: [[fiscal_year, '=', FY2026]]}
  sql: select count(*) filter (where payment_reduction_pct >= 3) as value from {hy} where fiscal_year = 'FY2026'

- id: s05
  category: single number
  question: What was the average penalty among hospitals that were actually penalized in FY2025?
  metric: avg_payment_reduction_among_penalized_pct
