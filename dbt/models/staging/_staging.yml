version: 2

# Staging: one cleaned table per raw source. Live sources: latest release. History models
# (*_history, and the supplemental files): every period CMS published (D-023). Only renaming,
# type conversion, recoding and removing non-data rows happen here; no business logic (D-020).
#
# Data tests (D-021) sit next to the column they protect. Severity `error` stops the build;
# `warn` reports a known, explained gap without stopping it. Business-rule tests that span
# several models are in dbt/tests/.

models:
  - name: stg_cms__hrrp
    description: >
      HRRP readmission results, one row per hospital x condition. Holds the target variable,
      excess_readmission_ratio. Rows without a ratio are kept, with the reason in score_status.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination: [facility_id, condition]
      - expression_is_true:
          name: hrrp_err_equals_predicted_over_expected
          arguments:
            expression: >
              score_status <> 'scored'
              or abs(excess_readmission_ratio - predicted_readmission_rate / expected_readmission_rate) < 0.001
    columns:
      - name: facility_id
        description: CMS Certification Number (CCN). Six characters, text, leading zeros kept.
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "regexp_full_match(facility_id, '[0-9A-Z]{6}')"
          - relationships:
              name: hrrp_hospitals_have_a_profile
              arguments:
                to: ref('stg_cms__hospitals')
                field: facility_id
              config:
                # 20 hospitals (120 rows) have HRRP results but no row in the newer Hospital
                # General Information release. HRRP covers mid-2021 to mid-2024, so a hospital
                # can close, merge or change type since then. Not checked one by one; see
                # dbt_test__audit.hrrp_hospitals_have_a_profile for the list. Known gap.
                severity: warn
      - name: condition
        description: AMI, HF, PN, COPD, HIP_KNEE or CABG. Same codes in every model.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [AMI, HF, PN, COPD, HIP_KNEE, CABG]
      - name: discharges
        description: >
          Eligible discharges in the period. NULL in some rows that do have a ratio;
          CMS does not publish it for every hospital.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: readmissions
        description: 30-day readmissions. NULL when suppressed (see readmissions_suppressed) or not scored.
      - name: readmissions_suppressed
        description: True when CMS hides a count of 1-10 readmissions for privacy ("Too Few to Report").
      - name: excess_readmission_ratio
        description: >
          ERR = predicted / expected readmission rate. Above 1 means more readmissions than
          expected for this hospital's patients. NULL when not scored.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0.3
                max_value: 3
      - name: predicted_readmission_rate
        description: Risk-adjusted readmission rate for this hospital, in percent.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: expected_readmission_rate
        description: Readmission rate an average hospital would have with these patients, in percent.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: footnote_code
        description: CMS footnote code(s), text. See stg_cms__footnotes. NULL when there is none.
      - name: score_status
        description: >
          scored (ratio present), too_few_cases (footnote 1, fewer than 25 cases),
          not_available (footnote 5), no_cases (footnote 7). The model can also produce
          'unknown' for a footnote code not seen before; the test below fails if that happens.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [scored, too_few_cases, not_available, no_cases]
      - name: period_start
        description: First day of the performance period (discharges from this date).
        data_tests:
          - not_null
      - name: period_end
        description: Last day of the performance period.
        data_tests:
          - not_null
      - name: source_release
        description: Raw release this row came from (the publisher's "modified" date).

  - name: stg_cms__hrrp_payment_adjustments
    description: >
      The HRRP penalty per hospital and fiscal year (FY 2020 - FY 2026), from the Supplemental
      Data Files. One row per hospital x fiscal year that HRRP applies to. Footer and empty rows
      are removed (hrrp_supplemental_rows macro).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination: [facility_id, fiscal_year]
      - expression_is_true:
          name: payment_reduction_matches_adjustment_factor
          arguments:
            expression: "abs((1 - payment_adjustment_factor) * 100 - payment_reduction_pct) < 0.0001"
    columns:
      - name: facility_id
        description: CMS Certification Number (CCN).
        data_tests:
          - not_null
          - expression_is_true:
              name: supplemental_facility_id_is_a_ccn
              arguments:
                expression: "regexp_full_match(facility_id, '[0-9A-Z]{6}')"
          - relationships:
              name: penalized_hospitals_have_hrrp_results
              arguments:
                to: ref('stg_cms__hrrp')
                field: facility_id
              config:
                # Latest fiscal year only: older years are checked against the archive in 6c.
                where: is_latest_fiscal_year
                # 8 hospitals are in the FY 2026 penalty file but not in the latest public HRRP
                # release (the two are published on different schedules). Known gap.
                severity: warn
      - name: fiscal_year
        description: Federal fiscal year the payment adjustment applies to (FY2026 = Oct 2025 - Sep 2026).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [FY2020, FY2021, FY2022, FY2023, FY2024, FY2025, FY2026]
      - name: is_latest_fiscal_year
        description: True for the newest fiscal year stored. Marts that describe "now" filter on it.
        data_tests:
          - not_null
      - name: payment_adjustment_factor
        description: Multiplier on Medicare base payments, between 0.97 and 1.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0.97
                max_value: 1
      - name: payment_reduction_pct
        description: >
          Penalty in percent units (0.12 = 0.12%). Equals (1 - payment_adjustment_factor) x 100.
          Published from FY 2022; computed from the factor for FY 2020 and FY 2021.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 3
      - name: payment_reduction_is_derived
        description: True when payment_reduction_pct was computed from the factor (FY 2020, FY 2021).
        data_tests:
          - not_null
      - name: is_penalized
        description: True when the payment adjustment factor is below 1 (payment_reduction_pct above 0).
      - name: dual_proportion
        description: Share of the hospital's Medicare patients also on Medicaid (0-1). Decides the peer group.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: peer_group
        description: 1-5, quintile of dual_proportion. Hospitals are compared with their peer group's median ERR.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: neutrality_modifier
        description: Scaling factor CMS applies to keep total penalties budget neutral.
        data_tests:
          - not_null

  - name: stg_cms__hrrp_peer_comparisons
    description: >
      The condition columns of the Supplemental Data Files reshaped to one row per hospital x
      fiscal year x condition, so they line up with stg_cms__hrrp. Includes ratios for small
      hospitals that the public HRRP file hides (fewer than 25 cases). No pneumonia rows for
      FY 2023: CMS suppressed that measure for the year because of COVID-19.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination: [facility_id, fiscal_year, condition]
      # CMS flags a condition only when the ERR is above the peer median AND the hospital had
      # at least 25 eligible discharges. Published values are rounded to 4 decimals, so a
      # flagged row may show ERR equal to the median (4 such ties exist); ">=" allows them.
      - expression_is_true:
          name: penalty_flag_implies_above_median_and_25_cases
          arguments:
            expression: >
              not is_above_peer_median
              or (excess_readmission_ratio >= peer_group_median_err and eligible_discharges >= 25)
      - expression_is_true:
          name: above_median_with_25_cases_implies_penalty_flag
          arguments:
            expression: >
              is_above_peer_median
              or coalesce(excess_readmission_ratio <= peer_group_median_err, true)
              or eligible_discharges < 25
    columns:
      - name: facility_id
        data_tests:
          - not_null
      - name: fiscal_year
        description: Fiscal year of the supplemental file. assert_supplemental_conditions_per_year
          checks every hospital-year has its conditions and a payment row.
      - name: condition
        data_tests:
          - accepted_values:
              arguments:
                values: [AMI, HF, PN, COPD, HIP_KNEE, CABG]
      - name: eligible_discharges
        description: Discharges counted for the penalty. 0 when the file shows '.' (none).
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
      - name: excess_readmission_ratio
        description: ERR used for the penalty. NULL when there were no eligible discharges.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0.3
                max_value: 3
      - name: peer_group_median_err
        description: Median ERR of the hospital's peer group for this condition; the penalty threshold.
        data_tests:
          - not_null
      - name: is_above_peer_median
        description: CMS penalty indicator (Y/N). See the two model-level tests for the exact rule.
        data_tests:
          - not_null
      - name: drg_payment_ratio
        description: This condition's share of the hospital's Medicare base payments; weights the penalty.

  - name: stg_cms__hospitals
    description: >
      Hospital profile, one row per hospital, all hospital types (acute care, critical access,
      psychiatric, VA, ...). HRRP covers acute care hospitals only; filtering happens in the marts.
    columns:
      - name: facility_id
        description: CMS Certification Number (CCN).
        data_tests:
          - unique
          - not_null
      - name: state
        data_tests:
          - not_null
      - name: zip_code
        data_tests:
          - expression_is_true:
              arguments:
                expression: "regexp_full_match(zip_code, '[0-9]{5}')"
      - name: county_name
        description: County name as CMS writes it. Matched to CDC county codes in step 5.
      - name: hospital_type
        data_tests:
          - not_null
      - name: has_emergency_services
        description: True / false from "Yes" / "No".
        data_tests:
          - not_null
      - name: overall_star_rating
        description: >
          CMS overall star rating, 1-5, NULL when not rated. Includes readmission measures, so
          it is not a valid input for predicting readmissions (target leakage).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: readm_measures_worse
        description: >
          Readmission measures worse than the national rate. Same leakage warning as
          overall_star_rating. Mortality (mort_) and safety (safety_) counts follow the same pattern.

  - name: stg_cms__hcahps
    description: >
      Patient survey results, one row per hospital x survey measure (68 per hospital), as
      published. 'Not Applicable' values (a column that does not apply to that kind of row) and
      'Not Available' values (missing for the hospital) are both NULL; measure_id tells which applies.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination: [facility_id, measure_id]
    columns:
      - name: facility_id
        data_tests:
          - not_null
      - name: measure_id
        description: e.g. H_COMP_6_LINEAR_SCORE (discharge information, 0-100 score).
        data_tests:
          - not_null
      - name: linear_mean_score
        description: 0-100 summary score of all answers to a question. Filled only on *_LINEAR_SCORE rows.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: star_rating
        description: 1-5 stars. Filled only on *_STAR_RATING rows.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: answer_pct
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: completed_surveys
        description: Surveys completed at the hospital in the period. Repeated on every row of the hospital.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: response_rate_pct
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: stg_cms__footnotes
    description: CMS footnote codes and their meaning. One row per code.
    columns:
      - name: footnote_code
        data_tests:
          - unique
          - not_null

  - name: stg_cdc__places_county
    description: >
      CDC PLACES county health estimates. One row per county x measure x value type. The national
      "US" row is removed. Measures come from BRFSS survey years 2022 or 2023 (data_year).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination: [county_fips, measure_id, value_type]
      - expression_is_true:
          name: places_suppressed_exactly_when_value_missing
          arguments:
            expression: "is_suppressed = (value_pct is null)"
      - expression_is_true:
          name: places_value_inside_confidence_interval
          arguments:
            expression: "value_pct is null or value_pct between value_pct_low and value_pct_high"
    columns:
      - name: county_fips
        description: 5-digit county FIPS code (state + county). The join key to hospitals in step 5.
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "regexp_full_match(county_fips, '[0-9]{5}')"
      - name: measure_id
        data_tests:
          - not_null
      - name: value_type
        description: CrdPrv (crude prevalence) or AgeAdjPrv (age-adjusted, for comparing counties).
        data_tests:
          - accepted_values:
              arguments:
                values: [CrdPrv, AgeAdjPrv]
      - name: value_pct
        description: Percent of adults. NULL when suppressed for a population under 50.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: is_suppressed
        description: True when CDC suppressed the estimate.

  - name: stg_census__zcta_county
    description: >
      Census 2020 ZIP Code Tabulation Area (ZCTA) to county relationship, as published. One row
      per ZCTA x county overlap. zcta is NULL for parts of a county outside every ZCTA.
      Connecticut appears with its pre-2022 counties here; see int_census__zcta_county.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination: [zcta, county_fips]
    columns:
      - name: zcta
        description: 5-digit ZCTA, the Census approximation of a ZIP code area.
      - name: county_fips
        description: 5-digit county FIPS code (2020 boundaries).
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "regexp_full_match(county_fips, '[0-9]{5}')"
      - name: county_name
        description: Full Census name including its type ('Baltimore County', 'Baltimore city').
        data_tests:
          - not_null
      - name: land_area_part
        description: Land area of the overlap in square meters.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0

  - name: stg_census__ct_zcta_town
    description: >
      Census 2022 Connecticut ZCTA to town relationship, as published. One row per ZCTA x town
      overlap. planning_region_fips is the county-level code CDC PLACES uses for Connecticut.
    columns:
      - name: town_fips
        data_tests:
          - not_null
      - name: planning_region_fips
        description: First 5 digits of the town code, e.g. 09170 South Central Connecticut.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cdc__places_county')
                field: county_fips
      - name: land_area_part
        data_tests:
          - not_null

  - name: stg_cms__hrrp_history
    description: >
      HRRP results for every performance period in the CMS archive (8 periods, 2014-2017 to
      2021-2024), one row per hospital x condition x period. Same columns and rules as
      stg_cms__hrrp, read from the latest archive snapshot of each period.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination: [facility_id, condition, period_start]
      - expression_is_true:
          name: hrrp_history_err_equals_predicted_over_expected
          arguments:
            expression: >
              score_status <> 'scored'
              or abs(excess_readmission_ratio - predicted_readmission_rate / expected_readmission_rate) < 0.001
    columns:
      - name: facility_id
        data_tests:
          - not_null
          - expression_is_true:
              name: hrrp_history_facility_id_is_a_ccn
              arguments:
                expression: "regexp_full_match(facility_id, '[0-9A-Z]{6}')"
      - name: condition
        data_tests:
          - not_null
          - accepted_values:
              name: hrrp_history_condition_codes
              arguments:
                values: [AMI, HF, PN, COPD, HIP_KNEE, CABG]
      - name: excess_readmission_ratio
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0.3
                max_value: 3
      - name: footnote_code
        description: Leading code of the footnote ('1 - The number of cases ...' becomes '1').
      - name: score_status
        data_tests:
          - not_null
          - accepted_values:
              name: hrrp_history_score_status_values
              arguments:
                values: [scored, too_few_cases, not_available, no_cases]
      - name: period_start
        data_tests:
          - not_null
      - name: period_end
        description: Last day of the period as published. The FY 2022 period says 2019-12-01.
        data_tests:
          - not_null
      - name: source_release
        description: The archive snapshot the row was read from (the latest that showed this period).
      - name: period_first_release
        description: The first archive snapshot that showed this period, i.e. roughly when it became public.
      - name: period_snapshots
        description: How many archive snapshots showed this period.

  - name: stg_cms__hcahps_history
    description: >
      Patient survey summary scores (linear mean scores and star ratings) for every survey
      window in the CMS archive, one row per hospital x measure x window. Answer-percentage rows
      are left out (see the model header).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination: [facility_id, measure_id, period_start, period_end]
    columns:
      - name: facility_id
        data_tests:
          - not_null
      - name: measure_id
        data_tests:
          - not_null
      - name: linear_mean_score
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: star_rating
        data_tests:
          - accepted_range:
              arguments:
                min_value: 1
                max_value: 5
      - name: completed_surveys
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
      - name: period_start
        data_tests:
          - not_null
      - name: period_end
        description: >
          Last day of the survey window. Windows are 12 months, except 6 and 9 months around
          2020 when CMS excused hospitals from collecting surveys during COVID-19.
        data_tests:
          - not_null

  - name: stg_cms__hospitals_history
    description: >
      The hospital profile as it was in every CMS archive snapshot since March 2019, one row per
      hospital x snapshot. Only columns present in every snapshot.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination: [facility_id, snapshot_date]
    columns:
      - name: facility_id
        data_tests:
          - not_null
      - name: snapshot_date
        description: Date of the archive snapshot; the profile as it was on that date.
        data_tests:
          - not_null
      - name: has_emergency_services
        data_tests:
          - not_null
      - name: overall_star_rating
        description: 1-5. Includes readmission measures, so never a model input (leakage).
        data_tests:
          - accepted_range:
              arguments:
                min_value: 1
                max_value: 5
