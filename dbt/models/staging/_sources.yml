version: 2

# The raw layer, declared as dbt sources.
#
# Each table reads every stored release of a source (data/raw/<source>/*.parquet), not only the
# latest. Staging models pick the release they need: the latest by default, and older releases
# when step 6 lines up time periods. `union_by_name` keeps the read working if CMS adds or
# reorders columns between releases.
#
# Every value is still the text CMS/CDC published (D-018). Converting it is the job of staging.
# Every table also carries the lineage columns _source, _release and _ingested_at.

sources:
  - name: raw
    description: Untouched CMS and CDC releases written by `hri ingest`.
    meta:
      external_location: "read_parquet('{{ var('raw_dir') }}/{name}/*.parquet', union_by_name = true)"
    tables:
      - name: hrrp
        description: >
          Hospital Readmissions Reduction Program. One row per hospital x condition per release.
          The target variable is "Excess Readmission Ratio". Missing values are text
          ("N/A", "Too Few to Report") with a reason code in "Footnote".
      - name: hrrp_supplemental
        description: >
          HRRP Supplemental Data File, one release per fiscal year (FY2020-FY2026). One row per
          hospital. Peer group, peer-group median ERR per condition, penalty indicators and the
          payment adjustment. Quirks: "." means no eligible discharges, percentages are text such
          as "0.12%", the last row is an "End of worksheet" footer (or empty rows), and column
          capitalization differs by year ("Dual Proportion" in FY2020).
      - name: hospital_info
        description: >
          Hospital General Information. One row per hospital: location, county, type,
          ownership, emergency services, overall star rating.
      - name: hcahps
        description: >
          Patient survey (HCAHPS). One row per hospital x survey answer (long format), so it
          has to be pivoted to one row per hospital before it can be joined.
      - name: footnotes
        description: Footnote Crosswalk. The meaning of each CMS footnote code.
      - name: places_county
        description: >
          CDC PLACES county data. One row per county x health measure x value type
          (crude or age-adjusted prevalence).
      - name: census_zcta_county
        description: >
          Census 2020 relationship file. One row per ZIP Code Tabulation Area (ZCTA) x county
          overlap, with the land area of the overlap (AREALAND_PART). Rows with an empty ZCTA are
          parts of a county outside every ZCTA (often water). No population counts.
      - name: census_ct_zcta_cousub
        description: >
          Census 2022 Connecticut file. One row per ZCTA x town (county subdivision) overlap.
          The first 5 digits of GEOID_COUSUB_22 are the planning region, which is what CDC PLACES
          uses as Connecticut's "county" since 2022.
      - name: hrrp_archive
        description: >
          CMS archive snapshots of the HRRP file, one release per snapshot date (D-023). Each
          snapshot holds one HRRP fiscal year; consecutive snapshots repeat the same year.
          Column names changed over time ("Provider ID" before late 2019, "Facility ID" after).
      - name: hcahps_archive
        description: >
          CMS archive snapshots of the patient survey (HCAHPS), one release per snapshot date.
          Each holds one 12-month survey window. Older releases name the dates
          "Measure Start Date" / "Measure End Date".
      - name: hospital_info_archive
        description: >
          CMS archive snapshots of Hospital General Information. Gives a ZIP code (and so a
          county) to hospitals that have since closed and are missing from the current file.
