# dbt project: turns the raw Parquet layer (data/raw, written by `hri ingest`) into clean,
# tested tables in a local DuckDB file (data/hri.duckdb). See docs/decisions.md D-005, D-006, D-019.
#
# Run it with `hri dbt <command>` from the project root (for example `hri dbt build`),
# or from inside this folder with plain `dbt build`.

name: hri
version: "0.1.0"
config-version: 2
profile: hri

flags:
  send_anonymous_usage_stats: false   # dbt otherwise reports usage to dbt Labs

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  # Where `hri ingest` writes the raw layer, relative to this dbt folder.
  raw_dir: "../data/raw"

data_tests:
  hri:
    # A failing test saves the rows that broke the rule to a table in the `dbt_test__audit`
    # schema, so the failure can be inspected with a query instead of re-running the test SQL.
    +store_failures: true

models:
  hri:
    # Staging: one cleaned model per raw source. Tables, not views (D-020): building a table runs
    # every type conversion, so a bad raw value fails `dbt build` instead of a later query, and
    # the stored data does not depend on the relative path to data/raw.
    staging:
      +materialized: table
      +schema: staging
    # Intermediate: reshaping and joining between staging and marts (e.g. pivoting the survey
    # to one row per hospital). Views: they only reshape staging tables, which already ran the
    # type conversions, so there is nothing to fail at query time.
    intermediate:
      +materialized: view
      +schema: intermediate
    # Marts: the star schema the model, the LLM agent and Power BI read (built in later steps).
    # Tables, because they are queried often and should be fast.
    marts:
      +materialized: table
      +schema: marts
    # ML: model-ready tables built from the marts (step 7). One row per training example, every
    # column with a documented role (key, target, split, feature) and a leakage review (D-024).
    ml:
      +materialized: table
      +schema: ml
    # Semantic layer (step 8, D-025): metric definitions read by MetricFlow, plus the day
    # calendar it requires. The YAML holds the definitions; only the calendar is a table.
    semantic:
      +materialized: table
      +schema: semantic
