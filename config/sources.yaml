# Raw data sources ingested by `hri ingest`.
#
# Adding a source means adding an entry here, not writing new code. Each entry says:
#   kind              which downloader to use (see src/hri/ingest/fetch.py)
#   required_columns  columns that must exist, or the run stops (catches publisher schema changes)
#   min_rows          fewer rows than this means a broken or partial file, so the run stops

sources:
  hrrp:
    kind: cms_provider_data
    dataset_id: 9n3s-kdb3
    description: Hospital Readmissions Reduction Program, hospital x condition (target variable)
    required_columns:
      - Facility ID
      - Measure Name
      - Number of Discharges
      - Footnote
      - Excess Readmission Ratio
      - Predicted Readmission Rate
      - Expected Readmission Rate
      - Start Date
      - End Date
    min_rows: 10000

  hrrp_supplemental:
    kind: cms_zip
    # Published once per fiscal year with the IPPS final rule; not available through an API.
    # One release per fiscal year (D-023). Each year's file has its own layout, so read options
    # are set per release on top of the defaults below. `title` guards against CMS linking the
    # wrong year's file (its FY 2023 page links a copy of FY 2024).
    read_options:
      sep: "	"
      skiprows: 1          # first line is a title, not the header
      encoding: cp1252
    releases:
      - release: FY2020
        url: https://www.cms.gov/files/zip/fy-2020-ipps-final-rule-hospital-readmissions-reduction-program-supplemental-data-file.zip
        member: FY2020_IPPS_Final_Rule_HRRP_Supplemental_File tab2.txt
        title: FY 2020 IPPS Final Rule
      - release: FY2021
        url: https://www.cms.gov/files/zip/fy-2021-ipps-final-rule-hospital-readmissions-reduction-program-supplemental-data-file.zip
        member: FY2021_Final_Rule_Supplemental_File_FR FY 2021.txt
        title: FY 2021 IPPS Final Rule
      - release: FY2022
        url: https://www.cms.gov/files/zip/fy-2022-ipps-final-rule-hospital-readmissions-reduction-program-supplemental-data-file.zip
        member: 508_Compliant_Version_of_FR FY 2022.csv
        title: FY 2022 IPPS Final Rule
        read_options:
          sep: ","
          skiprows: 3      # title, "blank row", table name
      - release: FY2023
        # Not the "...zip-0" the CMS page links: that one is the FY 2024 file.
        url: https://www.cms.gov/files/zip/fy-2023-ipps-final-rule-hospital-readmissions-reduction-program-supplemental-data-file.zip
        member: FY2023_FR_Supplemental_File FR FY 2023.txt
        title: FY 2023 IPPS Final Rule
      - release: FY2024
        url: https://www.cms.gov/files/zip/fy-2024-ipps-final-rule-hospital-readmissions-reduction-program-supplemental-data-file.zip
        member: 508 version of FY2024_Final_Rule_Supplemental_File Variations FR FY 2024 tab .txt
        title: FY 2024 IPPS Final Rule
      - release: FY2025
        url: https://www.cms.gov/files/zip/fy-2025-ipps-final-rule-hospital-readmissions-reduction-program-supplemental-data-file.zip
        member: 508-Version-FR-FY-2025.csv
        title: FY 2025 IPPS/LTCH PPS Final Rule
        read_options:
          sep: ","
          encoding: utf-8-sig   # starts with a byte-order mark
      - release: FY2026
        url: https://www.cms.gov/files/zip/fy2026-hospital-readmissions-reduction-program-supplemental-data-file.zip
        member: FR FY 2026.txt
        title: FY 2026 IPPS/LTCH PPS Final Rule
    description: HRRP peer groups, peer-group median ERRs, penalty indicators and payment reductions
    # Names that exist in every year (capitalization differs; the check ignores it).
    # "Payment reduction percentage" only exists from FY 2022.
    required_columns:
      - Hospital CCN
      - Payment adjustment factor
      - Dual proportion
      - Peer group assignment
      - Neutrality modifier
      - ERR for HF
      - Peer group median ERR for HF
      - Penalty indicator for HF
      - DRG payment ratio for HF
    min_rows: 2500

  hospital_info:
    kind: cms_provider_data
    dataset_id: xubh-q36u
    description: Hospital General Information, one row per hospital (profile, county, star rating)
    required_columns:
      - Facility ID
      - State
      - ZIP Code
      - County/Parish
      - Hospital Type
      - Hospital Ownership
      - Emergency Services
      - Hospital overall rating
    min_rows: 4000

  hcahps:
    kind: cms_provider_data
    dataset_id: dgck-syfz
    description: Patient survey (HCAHPS), hospital x survey answer
    required_columns:
      - Facility ID
      - HCAHPS Measure ID
      - HCAHPS Linear Mean Value
      - Number of Completed Surveys
      - Start Date
      - End Date
    min_rows: 200000

  footnotes:
    kind: cms_provider_data
    dataset_id: y9us-9xdf
    description: Footnote Crosswalk, the meaning of each CMS footnote code
    required_columns:
      - Footnote
      - Footnote Text
    min_rows: 10

  places_county:
    kind: cdc_socrata
    dataset_id: swc5-untb
    description: CDC PLACES county-level health measures
    required_columns:
      - Year
      - StateAbbr
      - LocationName
      - LocationID
      - MeasureId
      - Data_Value
      - Data_Value_Type
    min_rows: 100000

  census_zcta_county:
    kind: static_file
    # Census 2020 relationship file: which counties each ZIP Code Tabulation Area (ZCTA) overlaps,
    # with the land area of each overlap. Fixed vintage, so the release is set here (D-022).
    url: https://www2.census.gov/geo/docs/maps-data/data/rel2020/zcta520/tab20_zcta520_county20_natl.txt
    release: "2020"
    read_options:
      sep: "|"
      encoding: utf-8-sig   # the file starts with a byte-order mark
    description: Census ZIP Code Tabulation Area to county relationship (2020 boundaries)
    required_columns:
      - GEOID_ZCTA5_20
      - GEOID_COUNTY_20
      - NAMELSAD_COUNTY_20
      - AREALAND_PART
    min_rows: 40000

  census_ct_zcta_cousub:
    kind: static_file
    # Connecticut replaced its 8 counties with 9 planning regions in 2022, and CDC PLACES uses the
    # regions. This file links ZCTAs to 2022 towns, whose code starts with the region code.
    url: https://www2.census.gov/geo/docs/maps-data/data/rel2022/acs22_cousub22_zcta520_st09.txt
    release: "2022"
    read_options:
      sep: "|"
      encoding: utf-8-sig
    description: Census Connecticut ZCTA to 2022 county subdivision relationship (planning regions)
    required_columns:
      - GEOID_COUSUB_22
      - NAMELSAD_COUSUB_22
      - GEOID_ZCTA5_20
      - AREALAND_PART
    min_rows: 400         # 443 rows in the 2022 file

  # CMS archive snapshots (D-023): every hospital dataset, about once a quarter since 2019. Each
  # snapshot is one release, labelled with its date. Kept apart from the live sources above so
  # the current pipeline is unchanged; step 6 staging combines them to line up time periods.
  # File names inside a snapshot changed over the years, so each source lists every name used.

  hrrp_archive:
    kind: cms_archive
    archive_theme: hospitals
    description: Archived HRRP releases, hospital x condition (one HRRP fiscal year per snapshot)
    members:
      - "HOSPITAL_QUARTERLY_QUALITYMEASURE_RRP_HOSPITAL.csv"    # 2019 - May 2020
      - "9n3s-kdb3*.csv"                                        # late 2020: named by dataset ID
      - "*Readmissions_Reduction_Program_Hospital.csv"          # 2021 on: FY_2025_Hospital_...
    required_columns:
      - [Facility ID, Provider ID]
      - Measure Name
      - Number of Discharges
      - Excess Readmission Ratio
      - Start Date
      - End Date
    min_rows: 10000

  hcahps_archive:
    kind: cms_archive
    archive_theme: hospitals
    description: Archived patient survey (HCAHPS) releases, hospital x survey answer
    members:
      - "HCAHPS - Hospital.csv"
      - "dgck-syfz*.csv"
      - "HCAHPS-Hospital.csv"
    required_columns:
      - [Facility ID, Provider ID]
      - HCAHPS Measure ID
      - HCAHPS Linear Mean Value
      - Number of Completed Surveys
      - [Start Date, Measure Start Date]
      - [End Date, Measure End Date]
    min_rows: 200000

  hospital_info_archive:
    kind: cms_archive
    archive_theme: hospitals
    description: Archived Hospital General Information releases (ZIP codes of hospitals since closed)
    members:
      - "Hospital General Information.csv"
      - "xubh-q36u*.csv"
      - "Hospital_General_Information.csv"
    required_columns:
      - [Facility ID, Provider ID]
      - State
      - ZIP Code
      - [County Name, County/Parish]
      - Hospital Type
      - Hospital Ownership
    min_rows: 4000
